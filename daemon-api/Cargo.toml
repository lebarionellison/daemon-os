[package]
name = "daemon-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
daemon-core = { path = "../daemon-core" }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
